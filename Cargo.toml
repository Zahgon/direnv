[package]
name = "direnv"
version = "2.37.1"
edition = "2021"
rust-version = "1.88"
description = "unclutter your .profile"
homepage = "https://direnv.net"
repository = "https://github.com/direnv/direnv"
license = "MIT"
publish = false

[[bin]]
name = "direnv"
path = "src/main.rs"

[lib]
name = "direnv"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
libc = "0.2"
regex = "1"
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }

[profile.release]
strip = true
